[package]
name = "phosai-normalizer"
version = "0.1.0"
edition = "2021"
authors = ["Teric Labs <info@tericlabs.com>"]
description = "Production Text Normalisation Library for Text-to-Speech (TTS) Synthesis in African and International Languages"
license = "MIT"

[dependencies]
regex = "1.10"
unicode-normalization = "0.1"
once_cell = "1.19"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
