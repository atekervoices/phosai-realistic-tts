services:
  # Unified Rust + LibTorch (tch-rs) TorchScript Inference Server:
  # Native CUDA FP16 / CPU FP32 SlowAR + Fused FastARLoop + Streaming ArkttsCodec
  audio8-tts-rs:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        HF_TOKEN: ${HF_TOKEN:-}
        MODEL_ID: ${MODEL_ID:-phosai/realistic-v1}
        EXPORT_PRECISION: ${EXPORT_PRECISION:-fp16,fp32}
    container_name: audio8-tts-rs
    restart: unless-stopped
    ports:
      - "${PORT:-18473}:18473"
    environment:
      - ARKTTS_MODEL_DIR=/app/model
      - ARKTTS_VOICES_DIR=/app/voices
      - ARKTTS_DEVICE=${ARKTTS_DEVICE:-auto}
      - ARKTTS_PRECISION=${ARKTTS_PRECISION:-fp16}
      - ARKTTS_WORKERS=${ARKTTS_WORKERS:-1}
      - ARKTTS_THREADS=${ARKTTS_THREADS:-4}
      - OUTPUT_SAMPLE_RATE=${OUTPUT_SAMPLE_RATE:-16000}
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      - PORT=18473
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
