services:
  # ── 1. SGLang-Omni High-Throughput Continuous-Batching GPU Backend ──
  sglang-backend:
    build:
      context: .
      dockerfile: Dockerfile.sglang
    container_name: sglang-backend
    restart: unless-stopped
    ports:
      - "8010:8010"
    environment:
      - CUDA_VISIBLE_DEVICES=0
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - MODEL=${MODEL:-phosai/realistic-v1}
      - HF_TOKEN=${HF_TOKEN:-}
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN:-}
      - AUDIO8_TTS_STREAM_ENABLED=1
      - AUDIO8_TTS_ATTENTION_BACKEND=flashinfer
      - AUDIO8_TTS_MEM_FRACTION_STATIC=0.25
      - FLASHINFER_DISABLE_VERSION_CHECK=1
      - PORT=8010
      - HOST=0.0.0.0
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
      - ./models:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    shm_size: '4gb'

  # ── 2. Unified Rust Gateway: Streaming HTTP/WS, African Normalizer & 94 Voices ──
  audio8-tts-rs:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        HF_TOKEN: ${HF_TOKEN:-}
        MODEL_ID: ${MODEL_ID:-phosai/realistic-v1}
    container_name: audio8-tts-rs
    restart: unless-stopped
    ports:
      - "${PORT:-18473}:18473"
    environment:
      - SGLANG_URL=http://sglang-backend:8010
      - ARKTTS_MODEL_DIR=/app/model
      - ARKTTS_VOICES_DIR=/app/voices
      - ARKTTS_DEVICE=${ARKTTS_DEVICE:-auto}
      - ARKTTS_WORKERS=${ARKTTS_WORKERS:-1}
      - ARKTTS_THREADS=${ARKTTS_THREADS:-4}
      - OUTPUT_SAMPLE_RATE=${OUTPUT_SAMPLE_RATE:-16000}
      - PORT=18473
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    depends_on:
      - sglang-backend
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
