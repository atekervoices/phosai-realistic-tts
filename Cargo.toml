[package]
name = "audio8-tts-rs"
version = "0.1.0"
edition = "2021"
authors = ["PhosAI <info@phosai.com>"]
description = "Low-latency native Rust + LibTorch (tch-rs) CUDA/CPU streaming TTS server for Audio8-TTS (phosai/realistic-v1)"
autoexamples = false

[[bin]]
name = "server"
path = "examples/server.rs"

[dependencies]
# Native LibTorch C++ / CUDA & CPU inference bindings (PyTorch 2.5.1 / CUDA 12.4)
tch = "0.18"
torch-sys = "0.18"
ndarray = "0.17"

# Text Normalizer & Tokenizer
phosai-normalizer = { path = "./phosai-normalizer-rs" }
tokenizers = { version = "0.23", default-features = false, features = ["onig"] }
regex = "1.10"

# Audio I/O & Signal Processing
hound = "3.5"

# Hashing, Randomness & Encoding
sha2 = "0.10"
hex = "0.4"
rand = "0.8"

# Error Handling
anyhow = "1.0"
thiserror = "2.0"

# Async HTTP / WebSocket Server (matching spark-tts-rs)
tokio = { version = "1.0", features = ["full"] }
warp = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bytes = "1.0"
futures-util = "0.3"
futures = "0.3"
multer = "3.0"
mime = "0.3"

# CLI & OpenAPI Documentation
clap = { version = "4.0", features = ["derive"] }
utoipa = { version = "4.2", features = ["yaml"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
